name: tests
on:
  # Branches of this repo are tested on push. The generated PR is a bot PR, which GitHub holds for
  # approval on pull_request, so generate.yml dispatches the tests for it instead.
  push:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Install packages
        run: npm clean-install
      # Generated files must match the generator: a hand edit or lint autofix would be lost on the next run.
      - name: Check generated files are up to date
        run: |
          npm run generate
          git diff --exit-code -- nodes/BundleSocial/generated README.md
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm run test
