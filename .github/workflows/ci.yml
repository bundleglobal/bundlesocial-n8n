name: CI

on:
  pull_request:
  push:
    branches:
      - main

# Cancel in-progress runs for the same branch/PR to avoid wasting CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Generated files must match the generator: a hand edit or lint autofix would be lost on the next run.
      - name: Check generated files are up to date
        run: |
          npm run generate
          git diff --exit-code -- nodes/BundleSocial/generated README.md

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm test
