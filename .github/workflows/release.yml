name: release

on:
  workflow_run:
    workflows: ["tests"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      # n8n only accepts community nodes published from GitHub Actions with npm provenance.
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Install dependencies
        run: npm clean-install
      - name: Build
        run: npm run build
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Only for the first publish: trusted publishing can be set up once the package exists on npm.
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npx semantic-release

  skip-release:
    if: github.event.workflow_run.conclusion != 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Skip release
        run: |
          echo "::warning::Release skipped because the tests workflow did not succeed (${{ github.event.workflow_run.conclusion }})"
